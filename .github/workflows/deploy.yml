name: Deploy to Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Inject
        env:
          ABFD84: ${{ secrets.ABFD84 }}
          BAAFAE: ${{ secrets.BAAFAE }}
        run: |
          python3 -c "
          import os, pathlib, sys
          gm = os.environ.get('ABFD84', '')
          bm = os.environ.get('BAAFAE', '')
          p = pathlib.Path('index.html')
          s = s2 = p.read_text(encoding='utf-8')
          if gm:
              s2 = s2.replace('<!-- 1b8f1446daf33197dcc6257a8911eb3c92e1b2 -->', gm)
          if bm:
              s2 = s2.replace('<!-- ea05d3c24cc8c634eee321d9271c27 -->', bm)
          if s2 == s and (gm or bm):
              sys.exit(1)
          if s2 != s:
              p.write_text(s2, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: publish
        uses: actions/deploy-pages@v4
